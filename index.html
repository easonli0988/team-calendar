<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團隊共用行事曆</title>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/linkifyjs@4.1.1/dist/linkify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/linkify-html@4.1.1/dist/linkify-html.min.js"></script>
  
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 15px; background-color: #f4f6f9; }
    #calendar { max-width: 1100px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 550px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #333; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .form-group textarea { height: 90px; resize: vertical; }
    
    .checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e9ecef; }
    .checkbox-item { display: flex; align-items: center; font-weight: normal; margin: 0; cursor: pointer; }
    .checkbox-item input { width: auto; margin-right: 5px; }

    /* 顏色選擇區塊 */
    .color-picker { display: flex; gap: 10px; margin-top: 5px; }
    .color-option { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
    .color-option.selected { border-color: #333; transform: scale(1.15); }

    .btn-group { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
    .btn { padding: 9px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #007bff; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-secondary { background: #6c757d; color: white; }
    
    .fc-event { cursor: pointer; border-radius: 4px; padding: 2px 4px; border: none !important; }
    .detail-row { margin-bottom: 12px; font-size: 15px; }
    .detail-label { font-weight: bold; color: #555; display: inline-block; width: 100px; }
    .desc-box { background: #f8f9fa; padding: 12px; border-radius: 6px; border-left: 4px solid #007bff; margin-top: 8px; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

  <div id="calendar"></div>

  <!-- 新增/編輯事件彈窗 -->
  <div id="eventModal" class="modal">
    <div class="modal-content">
      <h3 id="formModalTitle" style="margin-top:0;">新增團隊工作事項</h3>
      <form id="eventForm">
        <input type="hidden" id="eventId">

        <div class="form-group">
          <label>派單人員（誰建立的）</label>
          <select id="creator" required><option value="">載入中...</option></select>
        </div>

        <div class="form-group">
          <label>處理/協助人員（可多選）</label>
          <div id="assigneesContainer" class="checkbox-group">載入中...</div>
        </div>

        <div class="form-group">
          <label>事項標題</label>
          <input type="text" id="eventTitle" placeholder="例如：跟進南一教材進度" required>
        </div>

        <div class="form-group">
          <label>詳細內容（包含網址可自動轉超連結）</label>
          <textarea id="eventDesc" placeholder="請輸入詳細說明，或貼上會議 / Google 文件網址..."></textarea>
        </div>

        <!-- 顏色選擇 -->
        <div class="form-group">
          <label>事件顏色標記</label>
          <div class="color-picker">
            <div class="color-option selected" style="background:#007bff;" data-color="#007bff" onclick="selectColor('#007bff', this)"></div>
            <div class="color-option" style="background:#28a745;" data-color="#28a745" onclick="selectColor('#28a745', this)"></div>
            <div class="color-option" style="background:#dc3545;" data-color="#dc3545" onclick="selectColor('#dc3545', this)"></div>
            <div class="color-option" style="background:#ffc107;" data-color="#ffc107" onclick="selectColor('#ffc107', this)"></div>
            <div class="color-option" style="background:#6f42c1;" data-color="#6f42c1" onclick="selectColor('#6f42c1', this)"></div>
            <div class="color-option" style="background:#fd7e14;" data-color="#fd7e14" onclick="selectColor('#fd7e14', this)"></div>
          </div>
        </div>

        <div style="display: flex; gap: 15px;">
          <div class="form-group" style="flex: 1;">
            <label>是否提醒</label>
            <select id="needReminder">
              <option value="YES">是 (手機/電腦通知)</option>
              <option value="NO">否 (不發送通知)</option>
            </select>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>多久之前提醒</label>
            <select id="reminderMinutes">
              <option value="0">事件發生時</option>
              <option value="5">5 分鐘前</option>
              <option value="15" selected>15 分鐘前</option>
              <option value="30">30 分鐘前</option>
              <option value="60">1 小時前</option>
              <option value="1440">1 天前</option>
            </select>
          </div>
        </div>

        <div class="btn-group">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
          <button type="submit" class="btn btn-primary">儲存事件</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 檢視事件彈窗（帶有編輯與刪除按鈕） -->
  <div id="viewModal" class="modal">
    <div class="modal-content">
      <h3 id="viewTitle" style="margin-top:0; color:#007bff;">事項詳情</h3>
      <div class="detail-row"><span class="detail-label">派單人員：</span><span id="viewCreator"></span></div>
      <div class="detail-row"><span class="detail-label">處理人員：</span><span id="viewAssignees"></span></div>
      <div class="detail-row"><span class="detail-label">提醒設定：</span><span id="viewReminder"></span></div>
      <div class="detail-row" style="margin-top:15px;"><span class="detail-label">詳細內容：</span></div>
      <div id="viewDesc" class="desc-box"></div>
      
      <div class="btn-group">
        <button type="button" class="btn btn-danger" onclick="deleteCurrentEvent()">刪除/取消事件</button>
        <div>
          <button type="button" class="btn btn-secondary" style="margin-right:8px;" onclick="editCurrentEvent()">編輯事件</button>
          <button type="button" class="btn btn-primary" onclick="closeViewModal()">關閉</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzbfkX6z5MFBRRwSZmbmiSd1Y3skokjcR5KQ7Vf0GAGrefFLXkpGP2WJgCTyuuzpnsaEg/exec";

    let selectedStartStr = "";
    let selectedEndStr = "";
    let selectedColorHex = "#007bff";
    let calendar;
    let teamMembers = [];
    let currentActiveEvent = null;

    document.addEventListener('DOMContentLoaded', function() {
      fetchMembers();

      const calendarEl = document.getElementById('calendar');
      calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'timeGridWeek',
        slotDuration: '00:30:00',
        selectable: true,
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek,timeGridDay'
        },
        buttonText: { today: '今天', month: '月', week: '週', day: '日' },
        locale: 'zh-tw',

        events: function(fetchInfo, successCallback, failureCallback) {
          fetch(GAS_API_URL)
            .then(res => res.json())
            .then(data => {
              const formatted = data.map(evt => ({
                id: evt.id,
                title: `[${evt.creator || '未定'} ➔ ${evt.assignees || '所有人'}] ${evt.title}`,
                start: evt.start,
                end: evt.end,
                backgroundColor: evt.color || '#007bff',
                extendedProps: evt
              }));
              successCallback(formatted);
            })
            .catch(err => failureCallback(err));
        },

        select: function(info) {
          selectedStartStr = info.startStr;
          selectedEndStr = info.endStr;
          openModalForCreate();
        },

        eventClick: function(info) {
          currentActiveEvent = info.event.extendedProps;
          document.getElementById('viewTitle').innerText = currentActiveEvent.title;
          document.getElementById('viewCreator').innerText = currentActiveEvent.creator || '未指定';
          document.getElementById('viewAssignees').innerText = currentActiveEvent.assignees || '未指定';
          
          let remText = currentActiveEvent.needReminder === 'YES' ? `是 (前 ${currentActiveEvent.reminderMinutes} 分鐘)` : '否';
          document.getElementById('viewReminder').innerText = remText;

          const descHtml = linkifyHtml(currentActiveEvent.description || '無詳細說明', { target: '_blank' });
          document.getElementById('viewDesc').innerHTML = descHtml;

          document.getElementById('viewModal').style.display = 'flex';
        }
      });

      calendar.render();
    });

    function fetchMembers() {
      fetch(GAS_API_URL + "?action=getMembers")
        .then(res => res.json())
        .then(data => {
          teamMembers = data;
          
          const creatorSelect = document.getElementById('creator');
          creatorSelect.innerHTML = '<option value="">-- 請選擇派單人 --</option>' + 
            teamMembers.map(m => `<option value="${m}">${m}</option>`).join('');

          const assigneesContainer = document.getElementById('assigneesContainer');
          if (teamMembers.length === 0) {
            assigneesContainer.innerHTML = '<em>讀取中，或請確定試算表 Members 分頁 A 欄有填寫名單</em>';
          } else {
            assigneesContainer.innerHTML = teamMembers.map(m => `
              <label class="checkbox-item">
                <input type="checkbox" name="assigneeCb" value="${m}"> ${m}
              </label>
            `).join('');
          }
        });
    }

    function selectColor(color, el) {
      selectedColorHex = color;
      document.querySelectorAll('.color-option').forEach(opt => opt.classList.remove('selected'));
      el.classList.add('selected');
    }

    function openModalForCreate() {
      document.getElementById('eventId').value = "";
      document.getElementById('formModalTitle').innerText = "新增團隊工作事項";
      document.getElementById('eventForm').reset();
      selectColor('#007bff', document.querySelectorAll('.color-option')[0]);
      document.getElementById('eventModal').style.display = 'flex';
    }

    function editCurrentEvent() {
      closeViewModal();
      const evt = currentActiveEvent;
      document.getElementById('eventId').value = evt.id;
      document.getElementById('formModalTitle').innerText = "編輯工作事項";
      document.getElementById('creator').value = evt.creator || "";
      document.getElementById('eventTitle').value = evt.title || "";
      document.getElementById('eventDesc').value = evt.description || "";
      document.getElementById('needReminder').value = evt.needReminder || "YES";
      document.getElementById('reminderMinutes').value = evt.reminderMinutes || "15";

      // 勾選多選人員
      const assigneesArr = (evt.assignees || "").split(', ');
      document.querySelectorAll('input[name="assigneeCb"]').forEach(cb => {
        cb.checked = assigneesArr.includes(cb.value);
      });

      // 選取顏色
      const colorTarget = document.querySelector(`.color-option[data-color="${evt.color}"]`) || document.querySelectorAll('.color-option')[0];
      selectColor(evt.color || '#007bff', colorTarget);

      document.getElementById('eventModal').style.display = 'flex';
    }

    function deleteCurrentEvent() {
      if(!confirm(`確定要刪除/取消「${currentActiveEvent.title}」這項任務嗎？`)) return;
      
      closeViewModal();
      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'delete', id: currentActiveEvent.id })
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === "success") {
          calendar.refetchEvents();
        } else {
          alert("刪除失敗：" + data.message);
        }
      });
    }

    function closeModal() { document.getElementById('eventModal').style.display = 'none'; }
    function closeViewModal() { document.getElementById('viewModal').style.display = 'none'; }

    // 處理表單提交（新增或編輯）
    document.getElementById('eventForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const eventId = document.getElementById('eventId').value;
      const selectedAssignees = Array.from(document.querySelectorAll('input[name="assigneeCb"]:checked')).map(cb => cb.value);

      const payload = {
        action: eventId ? 'update' : 'create',
        id: eventId,
        creator: document.getElementById('creator').value,
        assignees: selectedAssignees,
        title: document.getElementById('eventTitle').value,
        description: document.getElementById('eventDesc').value,
        needReminder: document.getElementById('needReminder').value === 'YES',
        reminderMinutes: document.getElementById('reminderMinutes').value,
        color: selectedColorHex,
        start: selectedStartStr,
        end: selectedEndStr
      };

      closeModal();

      fetch(GAS_API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if(data.status === "success") {
          calendar.refetchEvents();
        } else {
          alert("操作失敗：" + data.message);
        }
      })
      .catch(err => alert("發送錯誤：" + err));
    });
  </script>
</body>
</html>
